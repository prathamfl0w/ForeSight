<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign Up | ForeSight</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <a class="nav-brand" href="index.html"
        >ForeSight <span class="slogan">Demand-based inventory planning</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="inventory.html">Inventory</a></li>
        <li><a href="analytics.html">Analytics</a></li>
      </ul>
      <a class="nav-cta" href="login.html">Sign in</a>
    </nav>

    <main class="auth-wrapper">
      <div class="auth-card">
        <p class="eyebrow">Get started</p>
        <h1>Create account</h1>
        <p class="auth-subtitle">Start forecasting inventory and automating reorder points.</p>

        <div id="auth-error" class="auth-error-box hidden" role="alert"></div>

        <form id="signup-form" class="auth-form" novalidate>
          <div class="form-row">
            <label for="signup-name">Full name</label>
            <input
              type="text"
              id="signup-name"
              placeholder="e.g. Alex Morgan"
              required
              autocomplete="name"
            />
          </div>

          <div class="form-row">
            <label for="signup-email">Email address</label>
            <input
              type="email"
              id="signup-email"
              placeholder="name@company.com"
              required
              autocomplete="email"
            />
          </div>

          <div class="form-row">
            <label for="signup-password">Password (at least 6 characters)</label>
            <input
              type="password"
              id="signup-password"
              placeholder="••••••••"
              required
              minlength="6"
              autocomplete="new-password"
            />
          </div>

          <div class="form-row">
            <label for="signup-confirm-password">Confirm password</label>
            <input
              type="password"
              id="signup-confirm-password"
              placeholder="••••••••"
              required
              minlength="6"
              autocomplete="new-password"
            />
          </div>

          <button type="submit" id="btn-submit">Create account</button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="login.html">Sign in here</a>
        </div>
      </div>
    </main>

    <script src="js/auth.js"></script>
    <script>
      const form = document.getElementById('signup-form');
      const nameInput = document.getElementById('signup-name');
      const emailInput = document.getElementById('signup-email');
      const passwordInput = document.getElementById('signup-password');
      const confirmPasswordInput = document.getElementById('signup-confirm-password');
      const errorBox = document.getElementById('auth-error');
      const submitBtn = document.getElementById('btn-submit');

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.classList.add('hidden');
        errorBox.textContent = '';

        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        const password = passwordInput.value;
        const confirmPassword = confirmPasswordInput.value;

        // Validations
        if (!name || !email || !password || !confirmPassword) {
          errorBox.textContent = 'Please fill out all fields.';
          errorBox.classList.remove('hidden');
          return;
        }

        if (password.length < 6) {
          errorBox.textContent = 'Password must be at least 6 characters.';
          errorBox.classList.remove('hidden');
          return;
        }

        if (password !== confirmPassword) {
          errorBox.textContent = 'Passwords do not match.';
          errorBox.classList.remove('hidden');
          return;
        }

        submitBtn.disabled = true;
        const originalText = submitBtn.textContent;
        submitBtn.textContent = 'Creating account...';

        try {
          await Auth.register(name, email, password);
          window.location.href = 'dashboard.html';
        } catch (err) {
          errorBox.textContent = err.message || 'Registration failed.';
          errorBox.classList.remove('hidden');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
        }
      });
    </script>
  </body>
</html>
