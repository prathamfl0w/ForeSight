<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | ForeSight</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav class="navbar">
      <a class="nav-brand" href="index.html"
        >ForeSight <span class="slogan">Demand-based inventory planning</span>
      </a>
      <ul class="nav-links">
        <li><a href="index.html">Home</a></li>
        <li><a href="dashboard.html">Dashboard</a></li>
        <li><a href="inventory.html">Inventory</a></li>
        <li><a href="analytics.html">Analytics</a></li>
      </ul>
      <a class="nav-cta" href="signup.html">Create account</a>
    </nav>

    <main class="auth-wrapper">
      <div class="auth-card">
        <p class="eyebrow">Welcome back</p>
        <h1>Sign in</h1>
        <p class="auth-subtitle">Access your demand forecasts and reorder alerts.</p>

        <!-- Demo account quick fill for viva / presentations -->
        <div class="auth-demo-box">
          <div class="auth-demo-text">
            <strong>Evaluation Demo Account</strong>
            <span>demo@example.com &bull; password123</span>
          </div>
          <button type="button" class="btn-demo-fill" id="btn-fill-demo">Use Demo</button>
        </div>

        <div id="auth-error" class="auth-error-box hidden" role="alert"></div>

        <form id="login-form" class="auth-form" novalidate>
          <div class="form-row">
            <label for="login-email">Email address</label>
            <input
              type="email"
              id="login-email"
              placeholder="name@company.com"
              required
              autocomplete="email"
            />
          </div>

          <div class="form-row">
            <label for="login-password">Password</label>
            <input
              type="password"
              id="login-password"
              placeholder="••••••••"
              required
              autocomplete="current-password"
            />
          </div>

          <button type="submit" id="btn-submit">Sign in</button>
        </form>

        <div class="auth-footer">
          Don't have an account yet? <a href="signup.html">Create one here</a>
        </div>
      </div>
    </main>

    <script src="js/auth.js"></script>
    <script>
      const form = document.getElementById('login-form');
      const emailInput = document.getElementById('login-email');
      const passwordInput = document.getElementById('login-password');
      const errorBox = document.getElementById('auth-error');
      const submitBtn = document.getElementById('btn-submit');
      const fillDemoBtn = document.getElementById('btn-fill-demo');

      // Autofill demo button
      fillDemoBtn.addEventListener('click', () => {
        emailInput.value = 'demo@example.com';
        passwordInput.value = 'password123';
        errorBox.classList.add('hidden');
      });

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        errorBox.classList.add('hidden');
        errorBox.textContent = '';

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {
          errorBox.textContent = 'Please enter both email and password.';
          errorBox.classList.remove('hidden');
          return;
        }

        submitBtn.disabled = true;
        const originalText = submitBtn.textContent;
        submitBtn.textContent = 'Signing in...';

        try {
          await Auth.login(email, password);
          // Redirect to dashboard on successful login
          window.location.href = 'dashboard.html';
        } catch (err) {
          errorBox.textContent = err.message || 'Login failed. Please check credentials.';
          errorBox.classList.remove('hidden');
        } finally {
          submitBtn.disabled = false;
          submitBtn.textContent = originalText;
        }
      });
    </script>
  </body>
</html>
